<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="880" viewBox="0 0 1140 880" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura de segurança proposta para o AZ1</title>
<desc id="desc">Visão geral dos fluxos de identidade, consulta e recuperação, ingestão de anexos, provedores externos e validação humana. MVP com dados sintéticos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1140" height="880" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="40" y="40" font-size="25" font-weight="700">AZ1: arquitetura de segurança proposta</text>
<text x="40" y="68" font-size="16" fill="#475569">PMO Corporativo do Metrô de São Paulo • MVP com dados sintéticos</text>
<path d="M320 142 H430" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 190 V240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 190 V240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 345 V400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 345 V400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 510 V565" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 292 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 455 H820" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 510 V565" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 665 V710" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="95" width="280" height="95" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="56" y="122" font-size="16" font-weight="700">PROFISSIONAIS DO PMO</text><text x="56" y="145" font-size="14">Analistas, líderes e diretores</text><text x="56" y="165" font-size="14">React • Vite • Tailwind</text><text x="56" y="185" font-size="14">Texto, voz e anexos</text><rect x="430" y="95" width="280" height="95" rx="12" fill="#e0e7ff" stroke="#94a3b8"/><text x="446" y="122" font-size="16" font-weight="700">IDENTIDADE</text><text x="446" y="145" font-size="14">Supabase Auth + Entra ID</text><text x="446" y="165" font-size="14">Sessão validada</text><text x="446" y="185" font-size="14">Perfil e vínculos por projeto</text><rect x="40" y="240" width="670" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="56" y="267" font-size="16" font-weight="700">ENTRADA E BACKEND</text><text x="56" y="290" font-size="14">HTTPS + FastAPI: limites, validação de token e autorização</text><text x="56" y="310" font-size="14">scikit-learn, spaCy e NLTK: interpretação da solicitação</text><text x="56" y="330" font-size="14">Orquestrador: sessão isolada e contexto mínimo</text><rect x="40" y="400" width="280" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="56" y="427" font-size="16" font-weight="700">CONSULTAS E RAG</text><text x="56" y="450" font-size="14">Autorização antes da recuperação</text><text x="56" y="470" font-size="14">PostgreSQL + pgvector</text><text x="56" y="490" font-size="14">Projeto, fonte, versão e permissão</text><rect x="430" y="400" width="280" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="446" y="427" font-size="16" font-weight="700">INGESTÃO DE ANEXOS</text><text x="446" y="450" font-size="14">Validação e quarentena no MinIO</text><text x="446" y="470" font-size="14">RabbitMQ + worker Python</text><text x="446" y="490" font-size="14">Revalidar acesso antes de publicar</text><rect x="820" y="240" width="280" height="105" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="836" y="267" font-size="16" font-weight="700">DEEPGRAM</text><text x="836" y="290" font-size="14">Transcrição e recursos de voz</text><text x="836" y="310" font-size="14">Conteúdo mínimo autorizado</text><text x="836" y="330" font-size="14">Transcrição tratada como entrada</text><rect x="820" y="400" width="280" height="110" rx="12" fill="#ffedd5" stroke="#94a3b8"/><text x="836" y="427" font-size="16" font-weight="700">GEMINI</text><text x="836" y="450" font-size="14">Somente contexto autorizado</text><text x="836" y="470" font-size="14">Resposta e sugestão não confiáveis</text><text x="836" y="490" font-size="14">Sem alteração oficial automática</text><rect x="40" y="565" width="1060" height="100" rx="12" fill="#e0e7ff" stroke="#94a3b8"/><text x="56" y="592" font-size="16" font-weight="700">VALIDAÇÃO DA RESPOSTA E REVISÃO HUMANA</text><text x="56" y="615" font-size="14">Verificar fontes, versões, escopo e evidências antes de exibir ou reproduzir</text><text x="56" y="635" font-size="14">Profissional revisa sugestões e permanece responsável pelas decisões</text><rect x="40" y="710" width="1060" height="95" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="56" y="737" font-size="16" font-weight="700">CONTROLES TRANSVERSAIS NA EC2 ACADÊMICA</text><text x="56" y="760" font-size="14">Docker Compose • Rede restrita • Segredos protegidos • Auditoria minimizada</text><text x="56" y="780" font-size="14">Limites de consumo • Monitoramento • Backups e restauração</text><text x="40" y="842" font-size="14" fill="#475569">Fonte: elaboração própria (2026). Controles propostos; implementação e configuração a verificar.</text></g></svg>
